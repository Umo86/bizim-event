name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same extensions as Neon: postgis, unaccent, pg_trgm
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bizim_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations are in sync with the schema
        run: |
          pnpm exec drizzle-kit generate --name=ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Unit + integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
