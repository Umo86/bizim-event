name: E2E

# Real browser against `pnpm dev` and a throwaway Postgres: sign up, verify the email, log in,
# set up a venue, a caterer and a performer, get approved, add a second listing; changes
# requested and resubmitted, rejection, more businesses, wizard errors; the seeded test
# accounts; billing on the local simulator (no Stripe keys); and every page opened as a
# visitor, customer, business owner and admin. Docs-only pushes skip it.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  # Mondays, and when run by hand: every page in both languages (tests/e2e/pages.spec.ts).
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizim_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bizim_e2e
      # Throwaway values for a database that only exists during this job.
      BETTER_AUTH_SECRET: ci-e2e-only-secret-0a1b2c3d4e5f6a7b8c9d
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_FULL_CRAWL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # The test run loads the reference and test data itself (tests/e2e/global-setup.ts).
      - name: Database
        run: pnpm db:migrate
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
